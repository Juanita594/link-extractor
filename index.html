<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link Extractor Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="logo">L</div>
        <div>
          <p class="eyebrow">Link Extraction Utility</p>
          <h1>Link Extractor Pro</h1>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="loadSampleBtn" class="ghost-btn">نمونه متن</button>
        <input id="fileInput" type="file" accept=".txt" style="display:none" />
        <button id="chooseFileBtn" class="ghost-btn">بارگذاری فایل .txt</button>
      </div>
    </header>

    <main class="app-card">
      <section class="panel input-panel">
        <div class="panel-head">
          <h2>متن ورودی</h2>
          <span class="badge">Live</span>
        </div>

        <textarea id="inputText" spellcheck="false" placeholder="متن خود را اینجا وارد کنید...\nمثلاً: برای اطلاعات بیشتر به https://example.com مراجعه کنید یا [این صفحه](https://example.com) را ببینید."></textarea>

        <div class="action-row">
          <button id="extractBtn" class="primary-btn">جدا کردن لینک‌ها</button>
          <button id="clearBtn" class="secondary-btn">پاک کردن</button>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="panel-head stats-row">
          <h2>نتایج</h2>
          <div class="stat-pill"><span id="linkCount">0</span> لینک</div>
        </div>

        <div class="results-grid">
          <div class="result-box">
            <div class="box-header">
              <h3>لینک‌های کشف‌شده</h3>
              <div>
                <button id="copyLinks" class="mini-btn">کپی</button>
                <button id="exportCsv" class="mini-btn">صادر کردن CSV</button>
                <button id="exportJson" class="mini-btn">صادر کردن JSON</button>
              </div>
            </div>
            <ul id="linksList" class="link-list">
              <li class="empty-state">هیچ لینکی پیدا نشده است.</li>
            </ul>
          </div>

          <div class="result-box">
            <div class="box-header">
              <h3>متن بدون لینک</h3>
              <button id="copyText" class="mini-btn">کپی</button>
            </div>
            <pre id="remainingText" class="remaining-text">متن شما به‌صورت خودکار در اینجا نمایش داده می‌شود.</pre>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="lib/extract.js"></script>
  <script src="script.js"></script>
</body>
</html>
